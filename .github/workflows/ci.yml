name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.9

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck and build
        run: pnpm build

      - name: Smoke tests
        run: pnpm test:smoke

      - name: Build artifact checks
        run: pnpm test:build

      - name: Build at a GitHub Pages subpath
        run: SITE_BASE=/photography-field-guide pnpm build

      - name: Test the subpath build
        run: |
          SITE_BASE=/photography-field-guide pnpm test:smoke
          SITE_BASE=/photography-field-guide pnpm test:build
